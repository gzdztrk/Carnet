<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F0E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18121E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Mon Carnet de Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: Paris at golden hour, kept like a notebook — each screen has its own drawn street (landmark, shops, a living sky)
   fixed behind the page; boxes are softly see-through pages with notebook lines; one calm column */
:root{
  --bg:#F8F0E9; --card:#FFFBF7; --glass:color-mix(in srgb,#FFFBF7 82%,transparent); --line:#EADCD2; --text:#2E2230; --muted:#76626F;
  --accent:#7B4E8E; --accent-2:#A47AB5; --on-accent:#FFFFFF; --gold:#D29A45; --enamel:#3D5A99; --on-enamel:#FFFFFF;
  --wine:#B23A55; --wine-bg:#F8E4EA; --ok:#23825A; --ok-bg:#E2F3EA; --warn:#8A5A00; --warn-bg:#FBEFD4;
  --chip:#F1E4DD; --shadow:0 1px 2px rgba(70,40,40,.06),0 8px 24px rgba(70,40,40,.08);
  --sky-top:#F2CDB8; --sky-low:#F7E3DA; --city-far:#EBD3CB; --city-mid:#DDBCB3; --city-near:#C9A29C; --win:#FFF4E2; --win-op:.8;
  --rule:rgba(123,78,142,.16); --margin:rgba(214,84,92,.45); --ribbon:#B23A48;
  --shop-wall:#E6CFC6; --shop-sign:#6B4A57; --shop-cream:#FFF6EA; --shop-green:#3E7A5E; --shop-red:#B5474F; --shop-blue:#4467A8; --shop-glass:#FFF0D2; --shop-door:#6B4A57;
  --cloud:#FFFFFF; --cloud-btn:#FFFBF7; --cloud-btn-2:#FBEFF3;
  --f-display:"Comfortaa","Varela Round","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Comfortaa","Varela Round","Trebuchet MS",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18121E; --card:#221A2A; --glass:color-mix(in srgb,#221A2A 74%,transparent); --line:#3A2E45; --text:#F2EAF2; --muted:#B4A6BB;
  --accent:#C2A8F0; --accent-2:#9C84DA; --on-accent:#18121E; --gold:#F0B866; --enamel:#4A67AA; --on-enamel:#FFFFFF;
  --wine:#F08CA3; --wine-bg:#3A1C26; --ok:#7FD6A4; --ok-bg:#163126; --warn:#F2C162; --warn-bg:#33280F;
  --chip:#2E2438; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --sky-top:#1A132B; --sky-low:#3B2236; --city-far:#271D30; --city-mid:#31243B; --city-near:#3C2C47; --win:#F2C77A; --win-op:.6;
  --rule:rgba(194,168,240,.10); --margin:rgba(240,140,163,.4); --ribbon:#D35A6A;
  --shop-wall:#43334D; --shop-sign:#2A1F32; --shop-cream:#F6E6CF; --shop-green:#3E7A5E; --shop-red:#9E3B45; --shop-blue:#3D5A99; --shop-glass:#F2C77A; --shop-door:#2A1F32;
  --cloud:#4A3A55; --cloud-btn:#3D3050; --cloud-btn-2:#463456; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18121E; --card:#221A2A; --glass:color-mix(in srgb,#221A2A 74%,transparent); --line:#3A2E45; --text:#F2EAF2; --muted:#B4A6BB;
  --accent:#C2A8F0; --accent-2:#9C84DA; --on-accent:#18121E; --gold:#F0B866; --enamel:#4A67AA; --on-enamel:#FFFFFF;
  --wine:#F08CA3; --wine-bg:#3A1C26; --ok:#7FD6A4; --ok-bg:#163126; --warn:#F2C162; --warn-bg:#33280F;
  --chip:#2E2438; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --sky-top:#1A132B; --sky-low:#3B2236; --city-far:#271D30; --city-mid:#31243B; --city-near:#3C2C47; --win:#F2C77A; --win-op:.6;
  --rule:rgba(194,168,240,.10); --margin:rgba(240,140,163,.4); --ribbon:#D35A6A;
  --shop-wall:#43334D; --shop-sign:#2A1F32; --shop-cream:#F6E6CF; --shop-green:#3E7A5E; --shop-red:#9E3B45; --shop-blue:#3D5A99; --shop-glass:#F2C77A; --shop-door:#2A1F32;
  --cloud:#4A3A55; --cloud-btn:#3D3050; --cloud-btn-2:#463456; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(110px + env(safe-area-inset-bottom,0px))}


/* city scene behind the page */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-low) 55%,var(--bg) 100%)}
.street{margin-top:auto;width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);pointer-events:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--city-near) calc(84px + env(safe-area-inset-bottom,0px)),transparent 0)}
.street svg{width:100%;height:clamp(300px,58vw,600px);display:block}
html,body{overflow-x:clip}
.bg .moon{position:absolute;right:12%;top:calc(env(safe-area-inset-top,0px) + 70px);width:46px;height:46px;border-radius:50%;background:var(--win);opacity:0;box-shadow:0 0 30px var(--win)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bg .moon{opacity:.8}}
:root[data-theme="dark"] .bg .moon{opacity:.8}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;box-sizing:border-box;padding-bottom:0!important}
.wrap>*{flex-shrink:0}


/* living city */
.street .win{fill:var(--win);opacity:var(--win-op)}
.street .tw{fill:var(--win);opacity:var(--win-op);animation:twinkle 9s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:var(--win-op)}45%{opacity:.05}55%{opacity:.05}}
.street .cl{fill:var(--cloud);opacity:.75}
.street .c1{animation:drift 70s linear infinite}
.street .c2{animation:drift 95s linear infinite;animation-delay:-40s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(460px)}}
.street .bd{animation:fly 26s linear infinite}
.street .b2{animation-duration:31s;animation-delay:-9s}
@keyframes fly{0%{transform:translate(-160px,10px)}50%{transform:translate(120px,-8px)}100%{transform:translate(420px,4px)}}
.sparkle circle{fill:#FFF6D6;opacity:0}
body.sparkling .sparkle circle{animation:spark .9s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:0}50%{opacity:1}}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) body.sparkling .sparkle circle{animation:none}}
:root[data-theme="light"] body.sparkling .sparkle circle{animation:none}
.city-gap{height:30vh}

/* notebook touches */
.note{background-image:linear-gradient(90deg,transparent 22px,var(--margin) 22px,var(--margin) 23.5px,transparent 23.5px),repeating-linear-gradient(180deg,transparent 0 27px,var(--rule) 27px 28px)}
.hero::after{content:"";position:absolute;inset:8px;border:1.5px dashed color-mix(in srgb,var(--on-accent) 35%,transparent);border-radius:16px;pointer-events:none}
.ribbon{position:absolute;top:0;right:28px;width:20px;height:58px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:2}
.stitch{position:fixed;top:0;bottom:0;left:max(5px,env(safe-area-inset-left,0px));width:0;border-left:2px dashed color-mix(in srgb,var(--accent) 22%,transparent);z-index:1;pointer-events:none}

/* souvenirs */
.pc-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 10px}
.pc-row::-webkit-scrollbar{display:none}
.pc{flex:0 0 132px;background:var(--card);padding:7px 7px 6px;border-radius:6px;box-shadow:var(--shadow);transform:rotate(-1.5deg)}
.pc:nth-child(even){transform:rotate(1.5deg)}
.pc-art{height:84px;border-radius:3px;display:grid;place-items:center;overflow:hidden}
.pc-art svg{width:100%;height:100%}
.pc-t{font-family:var(--f-hand);font-size:1.2rem;text-align:center;margin-top:4px;line-height:1.1}
.pc.locked .pc-art{border:2px dashed var(--line);background:transparent;color:var(--muted);text-align:center}
.pc.locked .pc-art span{font-family:var(--f-body);font-weight:700;font-size:1.6rem;line-height:1.1;display:flex;flex-direction:column}
.pc.locked .pc-art small{font-size:.72rem;font-weight:400}
.pc.locked .pc-t{color:var(--muted)}

/* headers */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:22px 16px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1.05;margin:0;color:var(--text);text-wrap:balance;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:1rem;margin-top:6px}
.sync{font-size:.78rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--glass);border:0;border-radius:999px;padding:7px 12px;min-height:34px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.local i{background:var(--warn)}
.h2{font-family:var(--f-display);font-weight:700;font-size:1.4rem;margin:28px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.h2 a,.h2 button{font-family:var(--f-body);font-size:.95rem;font-weight:700;color:var(--accent);background:none;border:0;padding:4px 0;text-decoration:none}

/* hero: today's review */
.hero{position:relative;overflow:hidden;background:var(--accent);color:var(--on-accent);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hero>*{position:relative}
.hero .tower{position:absolute;right:-6px;bottom:-4px;width:120px;height:190px;opacity:.22;pointer-events:none}
.hero .tower svg{width:100%;height:100%}
.hero .mini{font-size:.92rem;opacity:.9;display:flex;gap:14px;flex-wrap:wrap}
.hero .lab{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .big{font-family:var(--f-body);font-weight:700;font-size:3.6rem;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.hero .big small{font-family:var(--f-body);font-size:1.05rem;font-weight:400;margin-left:8px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-body);font-size:1.7rem;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}

/* quick add */
.quick{display:flex;gap:8px;margin-top:14px}
.quick input{flex:1;min-width:0;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:54px;outline:none}
.quick input:focus{border-color:var(--accent)}
.quick .btn{flex:none}


/* home doors */
.doors{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.door{border:0;text-align:left;font:inherit;border-radius:22px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.door strong{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.1;position:relative}
.door .door-sub{font-size:1rem;position:relative;opacity:.9}
.door .door-ic{position:absolute;top:20px;left:20px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.door .door-ic svg{width:26px;height:26px}
.door.hero{color:var(--on-accent)}
.door.greet{min-height:170px;cursor:default}
.doors.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.doors.two .door{min-height:150px;padding:18px 16px}
.doors.two .door strong{font-size:1.6rem}
.doors.two .door .door-ic{top:16px;left:16px}
.door.hero .door-ic{background:color-mix(in srgb,var(--on-accent) 18%,transparent)}
.door.alt{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--text);background-image:linear-gradient(90deg,transparent 22px,var(--margin) 22px,var(--margin) 23.5px,transparent 23.5px),repeating-linear-gradient(180deg,transparent 0 27px,var(--rule) 27px 28px)}
.door.alt .door-ic{background:var(--chip);color:var(--accent)}
.door.alt .door-sub{color:var(--muted);opacity:1}


.door.shopfront{padding:0;justify-content:flex-start;gap:0;min-height:178px;background:var(--shop-wall);color:var(--shop-sign);border-radius:10px 10px 4px 4px}
.sf-sign{display:block;background:var(--shop-sign);color:var(--shop-cream);font-family:var(--f-display);font-weight:700;letter-spacing:.16em;text-align:center;padding:10px 6px;font-size:1.15rem}
.sf-awning{display:block;height:20px;position:relative;background:repeating-linear-gradient(90deg,var(--aw) 0 18px,var(--shop-cream) 18px 36px)}
.sf-awning::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;background:radial-gradient(circle at 9px 0,var(--aw) 8.5px,transparent 9px) 0 0/36px 9px repeat-x,radial-gradient(circle at 27px 0,var(--shop-cream) 8.5px,transparent 9px) 0 0/36px 9px repeat-x}
.sf-front{flex:1;display:flex;gap:8px;padding:18px 12px 12px;align-items:stretch}
.sf-window{flex:1;min-width:0;background:var(--shop-glass);border-radius:6px;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--shop-sign);font-weight:700;font-size:.95rem;text-align:center;padding:6px}
.sf-window svg{width:28px;height:28px}
.sf-door{flex:none;width:26px;height:96px;background:var(--shop-door);border-radius:4px 4px 0 0;position:relative}
.sf-door::after{content:"";position:absolute;right:5px;top:48px;width:4px;height:4px;border-radius:50%;background:var(--gold)}


/* cloud buttons */
.cloud-btn{position:relative;border:0;background:none;padding:46px 14px 22px;min-height:170px;font:inherit;color:var(--shop-sign);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;filter:drop-shadow(0 6px 14px rgba(60,30,60,.14))}
.cloud-btn .cb-shape{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.cloud-btn:not(.balloon) .cb-shape path{fill:var(--shop-glass);stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}
.cloud-btn.alt:not(.balloon) .cb-shape path{fill:var(--shop-glass)}
.cloud-btn>*:not(.cb-shape){position:relative;z-index:1}
.cloud-btn .cb-ic{width:52px;height:52px;display:grid;place-items:center;margin-bottom:0}
.cloud-btn .cb-ic svg{width:52px;height:52px;overflow:visible}
.cloud-btn:hover .cb-ic svg,.cloud-btn:focus-visible .cb-ic svg{transform:rotate(-6deg) scale(1.06);transition:transform .2s}
.cloud-btn strong{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.05}
.cloud-btn .cb-sub{font-size:.92rem;color:color-mix(in srgb,var(--shop-sign) 72%,transparent)}
.cloud-btn:active{transform:scale(.97)}


/* home: clouds rising from the Eiffel Tower */
.scene-home{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;padding-top:8px;position:relative;z-index:2}
.street.home{margin-top:calc(-0.4 * clamp(300px,58vw,600px))}
.scene-home .doors.two{margin-top:0}
.tower-zone{position:relative;height:230px}
.big-tower{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:120px;height:206px;overflow:visible}

.puff{position:absolute;border-radius:50%;background:var(--shop-glass);transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px var(--line);animation:puff 6s ease-in-out infinite}
.puff:nth-child(2n){animation-delay:-2s}.puff:nth-child(3n){animation-delay:-4s}
@keyframes puff{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-58%) scale(1.06)}}



/* surreal: the flying tower */
.tower-zone{height:270px}
.big-tower.float{width:200px;height:220px;bottom:40px}
.big-tower .tw-body{fill:var(--city-near)}
.strings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.strings path{fill:none;stroke:var(--shop-sign);stroke-width:1.4;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:.6}
.float-shadow{position:absolute;left:50%;bottom:22px;width:130px;height:16px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--shop-sign) 30%,transparent),transparent);animation:shadow 5s ease-in-out infinite}
.scene-home .doors.two,.tower-zone .float{animation:floaty 5s ease-in-out infinite}
.big-tower.float{animation-name:floatyTower}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes floatyTower{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
@keyframes shadow{0%,100%{transform:translateX(-50%) scale(1);opacity:1}50%{transform:translateX(-50%) scale(.88);opacity:.7}}


/* hot-air balloon buttons */
.cloud-btn.balloon{min-height:236px;padding:0 0 70px;margin-bottom:-6px;justify-content:center;filter:drop-shadow(0 8px 14px rgba(60,30,60,.18));color:#3B2A33}
.cloud-btn.balloon .cb-shape{inset:0;width:100%;height:100%}
.cloud-btn.balloon .cb-shape path,.cloud-btn.balloon .cb-shape rect{stroke-width:inherit}
.cloud-btn.balloon .cb-shape > path:first-child{stroke:none}
.cloud-btn.balloon .cb-ic{width:44px;height:44px}
.cloud-btn.balloon .cb-ic svg{width:44px;height:44px}
.cloud-btn.balloon strong{font-size:1.4rem}
.cloud-btn.balloon .cb-sub{color:#5A4450;font-size:.85rem;font-weight:700}


.tab.add .dot.croissant{width:46px;height:28px;border-radius:0;background:none;position:relative;margin:0}
.tab.add .dot.croissant svg{width:46px;height:30px;filter:drop-shadow(0 1.5px 1.5px rgba(90,50,20,.25))}
.tab.add .dot.croissant .plus{position:absolute;right:-6px;top:-8px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px;line-height:18px;text-align:center;font-family:var(--f-body)}
.tab.add:active .dot.croissant{transform:scale(.94)}

/* Comfortaa sizing */
.q-hand{font-size:1.3rem!important;line-height:1.45!important}
.note .ex,.detail-ex{font-size:1.15rem!important;line-height:1.45!important}
.ai-ex .fr{font-size:1.1rem!important}
.pc-t{font-size:.95rem!important;font-weight:700}
.answer-in[style*="f-hand"]{font-size:1.15rem!important}

/* game cards */
.plaques{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plaque-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px;margin:0 -2px}
.plaque-row::-webkit-scrollbar{display:none}
.plaque-row .plaque{flex:0 0 150px;min-height:108px}
.plaque{border:1px solid var(--line);text-align:left;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--text);border-radius:18px;padding:16px 14px;min-height:132px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative}
.plaque .ic{width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--accent);display:grid;place-items:center}
.plaque .ic svg{width:22px;height:22px}
.plaque strong{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.15}
.plaque span{font-size:.88rem;color:var(--muted);line-height:1.35}
.plaque .ai{position:absolute;top:12px;right:12px;font-size:.66rem;font-weight:700;letter-spacing:.08em;background:var(--chip);color:var(--accent);padding:3px 7px;border-radius:6px}
.plaque:disabled{opacity:.5}

/* search + chips */

/* note cards — café menu */
.list{display:flex;flex-direction:column;gap:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center}

/* sheets */

  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}

.vid{display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);text-decoration:none;color:var(--text)}

/* animated scene */
.stage{position:relative;height:340px;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;cursor:pointer;

<script>
(() => {

const OFFLINE = true;

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);

/* ---------- voix ---------- */
const TTS = { ok: "speechSynthesis" in window, voice:null };
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); TTS.voice = vs.find(v=>/^fr(-|_)FR/i.test(v.lang)) || vs.find(v=>/^fr/i.test(v.lang)) || null; }catch{} }

const MEDIA = { el:null, url:null };

  if (MEDIA.url) return MEDIA.url;
  const rate=8000, n=rate/4, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const w=(o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);

}

  try{ if (navigator.audioSession) navigator.audioSession.type = "playback"; }catch{}

    if (!MEDIA.el){ MEDIA.el = new Audio(); MEDIA.el.setAttribute("playsinline",""); MEDIA.el.preload="auto"; MEDIA.el.src = silentWavURL(); }

  }catch{}
}
["pointerdown","touchend","keydown"].forEach(ev => document.addEventListener(ev, mediaMode, { capture:true, passive:true }));
/* real audio from the relay (phone app): always plays, even in silent mode */

  try{
    if (!VOICE.el){ VOICE.el = new Audio(); VOICE.el.setAttribute("playsinline",""); VOICE.el.preload="auto"; }
    const el = VOICE.el;
    let fellBack = false;
    const fallback = () => { if (fellBack || my!==VOICE.token) return; fellBack = true; sayBuiltIn(t, rate, onEnd, pitch); };

}
const canSpeak = () => TTS.ok || !!relayVoice();
function speak(text, rate=0.92){ say(text, { rate }); }

/* ---------- stockage ---------- */
const KEYS = OFFLINE ? { notes:"carnet.notes", meta:"carnet.meta" } : { notes:"carnet.cache.notes", meta:"carnet.cache.meta" };
const S = {

}
async function write(id, data){

}
function saveNote(n){ const i=S.notes.findIndex(x=>x.id===n.id); if(i<0) S.notes.unshift(n); else S.notes[i]=n; cache(); render(); write(n.id, n); }

if (OFFLINE && navigator.storage && navigator.storage.persist) { try{ navigator.storage.persist(); }catch{} }

async function connect(){
  if (OFFLINE) return;

      S.notes=notes; if(meta) S.meta={ ...S.meta, streak:meta.streak||0, lastDay:meta.lastDay||"", reviews:meta.reviews||0 };
      S.mode="cloud"; cache(); if(!UI.session) render();
    }, () => { S.mode="local"; render(); });
  }catch(e){ S.mode="local"; render(); }
}

/* ---------- répétition espacée ---------- */
const isDue = n => (n.due||0) <= Date.now();
function grade(n, correct){
  const cur = S.notes.find(x=>x.id===n.id) || n;
  const box = correct ? Math.min((cur.box||0)+1, 5) : 0;
  const due = correct ? Date.now() + INTERVALS[box]*DAY - 3600000 : Date.now();
  const updated = { ...cur, box, due, seen:(cur.seen||0)+1, right:(cur.right||0)+(correct?1:0) };
  const i=S.notes.findIndex(x=>x.id===n.id); if(i>=0) S.notes[i]=updated;
  write(updated.id, updated);
  const t=dayKey(Date.now());
  if (S.meta.lastDay !== t){ S.meta.streak = S.meta.lastDay===dayKey(Date.now()-DAY) ? (S.meta.streak||0)+1 : 1; S.meta.lastDay=t; }
  S.meta.reviews=(S.meta.reviews||0)+1; saveMeta();
}
const streakNow = () => (S.meta.lastDay===dayKey(Date.now()) || S.meta.lastDay===dayKey(Date.now()-DAY)) ? (S.meta.streak||0) : 0;

/* ---------- IA ---------- */
async function askJSON(prompt, opts){ if(!S.ai) throw { code:"unavailable" }; return await S.ai.json(prompt, opts || { modelTier:"default" }); }
function aiErr(e){
  if(e && e.code==="not_granted"){ S.ai=null; return "L'aide de l'IA est désactivée pour cette page. Tu peux l'autoriser dans le menu des autorisations de la page."; }

}

/* ---------- Paris, dessiné ---------- */
function rng(seed){ let x=seed; return () => (x = (x*16807) % 2147483647) / 2147483647; }
function eiffelPath(cx, base, h){
  const w=h*0.32, t=h;
  return `M${cx-w/2} ${base} L${cx-w*0.1} ${base-t*0.55} L${cx-w*0.04} ${base-t*0.9} L${cx} ${base-t} L${cx+w*0.04} ${base-t*0.9} L${cx+w*0.1} ${base-t*0.55} L${cx+w/2} ${base} Z
    M${cx-w*0.3} ${base} Q${cx} ${base-t*0.2} ${cx+w*0.3} ${base} Z
    M${cx-w*0.36} ${base-t*0.3} h${w*0.72} v${t*0.03} h${-w*0.72} Z

}

  return `<rect x="${cx-30*s}" y="${base-26*s}" width="${60*s}" height="${26*s}"/>
    <ellipse cx="${cx}" cy="${base-26*s}" rx="${15*s}" ry="${18*s}"/><rect x="${cx-1.5*s}" y="${base-50*s}" width="${3*s}" height="${8*s}"/>
    <ellipse cx="${cx-22*s}" cy="${base-26*s}" rx="${7*s}" ry="${9*s}"/><ellipse cx="${cx+22*s}" cy="${base-26*s}" rx="${7*s}" ry="${9*s}"/>
    <rect x="${cx+32*s}" y="${base-52*s}" width="${9*s}" height="${52*s}"/><ellipse cx="${cx+36.5*s}" cy="${base-52*s}" rx="${5*s}" ry="${6*s}"/>`;
}

}
function buildings(r, y0, minH, maxH, fill, windows){
  let out="", x=-10;

    const w=34+r()*38, h=minH+r()*(maxH-minH), top=y0-h;
    out+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}"/>`;
    out+=`<path d="M${(x+3).toFixed(1)} ${top.toFixed(1)} L${(x+9).toFixed(1)} ${(top-12).toFixed(1)} L${(x+w-9).toFixed(1)} ${(top-12).toFixed(1)} L${(x+w-3).toFixed(1)} ${top.toFixed(1)} Z" fill="${fill}"/>`;

        for(let wx=x+7; wx<x+w-9; wx+=10){ if(r()<0.72){ const tw=r()<0.08; out+=`<rect class="${tw?"tw":"win"}" style="${tw?`animation-delay:${(r()*9).toFixed(1)}s`:""}" x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="4.5" height="8" rx="1"/>`; } }
        out+=`<rect x="${(x+5).toFixed(1)}" y="${(wy+9).toFixed(1)}" width="${(w-10).toFixed(1)}" height="1.4" fill="var(--win)" opacity=".35"/>`;
      }
    }

  }

}
function trees(r, y, fill){ let o=""; for(let x=10;x<400;x+=60+r()*60){ const s=9+r()*6; o+=`<circle cx="${x.toFixed(1)}" cy="${(y-s).toFixed(1)}" r="${s.toFixed(1)}" fill="${fill}"/><rect x="${(x-1.5).toFixed(1)}" y="${(y-s).toFixed(1)}" width="3" height="${s.toFixed(1)}" fill="${fill}"/>`; } return o; }
/* boutiques au rez-de-chaussée */
function awning(x, y, w, c1){ let s=""; const n=Math.round(w/8); for(let i=0;i<n;i++) s+=`<rect x="${(x+i*w/n).toFixed(1)}" y="${y}" width="${(w/n).toFixed(1)}" height="9" fill="${i%2?"var(--shop-cream)":c1}"/>`;
  s+=`<path d="M${x} ${y+9} ${Array.from({length:n},(_,i)=>`q${(w/n/2).toFixed(1)} 5 ${(w/n).toFixed(1)} 0`).join(" ")}" fill="${c1}"/>`; return s; }
function shop(kind, x, H){
  const w=78, top=H-44;
  let s=`<rect x="${x}" y="${top}" width="${w}" height="44" fill="var(--shop-wall)"/><rect x="${x}" y="${top}" width="${w}" height="9" fill="var(--shop-sign)"/>`;

  s+=`<text x="${x+w/2}" y="${top+6.8}" text-anchor="middle" font-family="Georgia,serif" font-size="5.6" letter-spacing=".6" fill="var(--shop-cream)">${label}</text>`;

  s+=`<rect x="${x+6}" y="${top+24}" width="${w-30}" height="18" fill="var(--shop-glass)"/><rect x="${x+w-20}" y="${top+22}" width="14" height="22" fill="var(--shop-door)"/>`;

  if(kind==="fromagerie") s+=`<g><ellipse cx="${gx+10}" cy="${gy+13}" rx="8" ry="4" fill="#F2C94C"/><rect x="${gx+2}" y="${gy+9}" width="16" height="4" fill="#F2C94C"/><ellipse cx="${gx+10}" cy="${gy+9}" rx="8" ry="3" fill="#F8DE84"/><path d="M${gx+24} ${gy+15} L${gx+44} ${gy+9} L${gx+44} ${gy+15} Z" fill="#F8DE84"/><circle cx="${gx+38}" cy="${gy+13}" r="1.2" fill="#E0B23B"/></g>`;
  if(kind==="cafe") s+=`<g fill="var(--shop-door)">${[x+10,x+34,x+58].map(cx=>`<ellipse cx="${cx}" cy="${H-9}" rx="7" ry="1.6"/><rect x="${cx-0.8}" y="${H-9}" width="1.6" height="9"/>`).join("")}</g><g stroke="var(--shop-door)" stroke-width="1.3" fill="none">${[x+3,x+18,x+27,x+42,x+51,x+66].map(cx=>`<path d="M${cx} ${H} v-8 h4 v8"/>`).join("")}</g><circle cx="${gx+12}" cy="${gy+8}" r="2.5" fill="var(--win)"/><circle cx="${gx+30}" cy="${gy+8}" r="2.5" fill="var(--win)"/>`;
  return s;
}
function clouds(){
  return `<g class="clouds"><g class="cl c1"><ellipse cx="60" cy="40" rx="26" ry="8"/><ellipse cx="76" cy="35" rx="16" ry="8"/></g>
    <g class="cl c2"><ellipse cx="250" cy="22" rx="30" ry="7"/><ellipse cx="236" cy="18" rx="14" ry="7"/></g></g>`;
}
function birds(){ return `<g class="birds" fill="none" stroke="var(--city-near)" stroke-width="1.4" stroke-linecap="round"><path class="bd b1" d="M100 70 q4 -4 8 0 q4 -4 8 0"/><path class="bd b2" d="M122 62 q3 -3 6 0 q3 -3 6 0"/></g>`; }
function sparkle(cx, base, h){
  let s=`<g class="sparkle">`; const r=rng(99);
  for(let i=0;i<26;i++){ const t=r(); const y=base-t*h; const half=(h*0.16)*(1-t)+1.5; const x=cx+(r()*2-1)*half;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.3" style="animation-delay:${(r()*0.8).toFixed(2)}s"/>`; }
  return s+`</g>`;
}
const SCENES = {};
function cityscape(scene){
  if (SCENES[scene]) return SCENES[scene];
  const r=rng({accueil:7,carnet:19,jeux:31,session:43}[scene]||7);
  const H=240; let land="", shops="";
  if (scene==="accueil"){ land=`<path fill="var(--city-mid)" fill-rule="evenodd" d="${eiffelPath(322, H-40, 150)}"/>${sparkle(322, H-40, 150)}`; shops=""; }
  if (scene==="carnet"){ land=`<g fill="var(--city-mid)">${sacreCoeur(160, H-78, 1.25)}</g><rect x="0" y="${H-80}" width="400" height="6" fill="var(--city-mid)" opacity=".6"/>`; shops=shop("fromagerie", 112, H)+shop("boulangerie", 194, H); }
  if (scene==="jeux"){ land=`<g fill="var(--city-mid)">${arcTriomphe(150, H-40, 92)}</g>`; shops=shop("cafe", 176, H); }
  if (scene==="session"){ land=`<path fill="var(--city-mid)" fill-rule="evenodd" d="${eiffelPath(262, H-40, 150)}"/>${sparkle(262, H-40, 150)}`; }

  return (SCENES[scene]=svg);

const SHEET = { hist:false, ignorePop:false };
function removeSheetNow(){ const s=$("#scrim"); if(s) s.remove(); document.body.style.overflow=""; }
function openSheet(html, onMount){
  const had = !!$("#scrim");
  removeSheetNow();
  const s=document.createElement("div"); s.className="scrim"; s.id="scrim";
  if (had) s.style.animation="none";
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-bar"><button class="sheet-back" type="button" aria-label="Retour">‹ Retour</button><span class="grab" aria-hidden="true"></span><button class="sheet-x" type="button" aria-label="Fermer">✕</button></div>
    ${html}</div>`;
  const sheet=$(".sheet",s);
  if (had) sheet.style.animation="none";
  s.addEventListener("click", e => { if(e.target===s) closeSheet(); });
  $(".sheet-back",s).addEventListener("click", () => closeSheet());
  $(".sheet-x",s).addEventListener("click", () => closeSheet());
  // swipe down to close
  let y0=null, dy=0, fromBar=false;
  sheet.addEventListener("touchstart", e => {
    fromBar = !!e.target.closest(".sheet-bar");
    if (!fromBar && sheet.scrollTop>0) { y0=null; return; }
    if (e.target.closest("input,textarea,select")) { y0=null; return; }
    y0=e.touches[0].clientY; dy=0; sheet.classList.remove("snap");
  }, { passive:true });
  sheet.addEventListener("touchmove", e => {
    if (y0===null) return;
    dy = e.touches[0].clientY - y0;
    if (dy<=0){ sheet.style.transform=""; return; }
    if (!fromBar && sheet.scrollTop>0){ y0=null; sheet.style.transform=""; return; }
    sheet.classList.add("dragging"); sheet.style.transform=`translateY(${dy}px)`;
    if (e.cancelable && dy>6) e.preventDefault();
  }, { passive:false });
  sheet.addEventListener("touchend", () => {
    if (y0===null) return; y0=null; sheet.classList.remove("dragging");
    if (dy>90){ sheet.style.setProperty("--drag",`translateY(${dy}px)`); closeSheet(); }
    else { sheet.classList.add("snap"); sheet.style.transform=""; }
  });
  document.body.appendChild(s); document.body.style.overflow="hidden";
  if (OFFLINE && !SHEET.hist){ try{ history.pushState({ carnetSheet:1 }, ""); SHEET.hist=true; }catch{} }
  onMount && onMount(s);
}
function closeSheet(){
  const s=$("#scrim"); if(!s || s.classList.contains("closing")) return;
  if (SHEET.hist){ SHEET.hist=false; SHEET.ignorePop=true; try{ history.back(); }catch{ SHEET.ignorePop=false; } }
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ removeSheetNow(); return; }
  s.classList.add("closing");
  setTimeout(() => { if (s.isConnected) s.remove(); if(!$("#scrim")) document.body.style.overflow=""; }, 210);
}
window.addEventListener("popstate", () => {
  if (SHEET.ignorePop){ SHEET.ignorePop=false; return; }
  if ($("#scrim")){ SHEET.hist=false; closeSheet(); }
});

/* ---------- remplissage automatique : sens + exemple ---------- */
const stripHTML = h => { try{ return (new DOMParser().parseFromString(String(h||""),"text/html").body.textContent||"").replace(/\s+/g," ").trim(); }catch{ return String(h||"").replace(/<[^>]+>/g,"").trim(); } };
const guessKind = t => { const w=t.trim().split(/\s+/).length; return (w>=5 || /[.!?…]$/.test(t.trim())) ? "phrase" : w>1 ? "expression" : "mot"; };
const fillPrompt = text => `A learner of French (B2-C1) added this to her vocabulary notebook: """${text}"""
Return JSON only:
{"kind": "mot" for a single word (with or without article), "expression" for an idiom or fixed phrase, "phrase" for a full sentence,
 "french": the same text, only fixing a clear spelling or accent mistake. If it is a single NOUN, always put its correct definite article in front: "le" or "la" (e.g. "livre" -> "le livre", "maison" -> "la maison"), "l'" before a vowel or mute h (e.g. "arbre" -> "l'arbre"), and "les" only for nouns used in the plural. Keep an article she already wrote if it is correct, fix it if it is wrong. Never add an article to verbs, adjectives, adverbs, expressions or sentences,
 "gender": for a noun "masculin" or "feminin", otherwise "",
 "meaning": a short, natural English meaning (for a sentence: its English translation; for a word with several meanings, the most common one, max 2 meanings separated by " / "),
 "example": one natural, everyday French example sentence using it, with the item itself wrapped in [square brackets] exactly where it appears (conjugate or adapt it if needed). For a full sentence, give a different short sentence that reuses its key expression, also bracketed.}`;
const normFill = (r, text) => {
  const french = String(r.french||text).trim();
  let meaning = String(r.meaning||"").trim();
  const g = String(r.gender||"").toLowerCase();
  if (/^(l['’]|les\s)/i.test(french) && /^(masc|fem|fém)/.test(g) && meaning && !/\((masculin|féminin)\)/.test(meaning))
    meaning += g.startsWith("masc") ? " (masculin)" : " (féminin)";
  return { kind:["mot","expression","phrase"].includes(r.kind)?r.kind:guessKind(text), french, meaning, example:String(r.example||"").trim() };
};
async function lookupAI(text){
  const r = await askJSON(fillPrompt(text), { model:"claude-haiku-5-5", modelTier:"quick" });
  return normFill(r, text);
}
/* phone app: free AI through the person's own Groq relay (Cloudflare Worker) */
const getRelay = () => { try{ return localStorage.getItem("carnet.relay") || ""; }catch{ return ""; } };
async function lookupRelay(text){
  const res = await fetch(getRelay(), { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ text, prompt: fillPrompt(text) }) });
  let j={}; try{ j = await res.json(); }catch{}
  if (!res.ok || j.error){ const e=new Error("relay"); e.status=res.status; e.groq=String(j.error||""); throw e; }
  return normFill(j, text);
}
/* phone app: Claude Haiku 5.5 through the person's own API key (stored only on this phone) */
const API_MODEL = "claude-haiku-5-5";
const getKey = () => { try{ return localStorage.getItem("carnet.apikey") || ""; }catch{ return ""; } };
async function lookupAPI(text){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":getKey(), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model:API_MODEL, max_tokens:400, messages:[{ role:"user", content: fillPrompt(text) }] })
  });
  if (!res.ok){ const e = new Error("api"); e.status = res.status; throw e; }
  const j = await res.json();
  const txt = (j.content||[]).map(c=>c.text||"").join("");
  const m = txt.match(/\{[\s\S]*\}/); if(!m) throw new Error("format");
  return normFill(JSON.parse(m[0]), text);
}
async function lookupOnline(text){
  // phone app: free online dictionaries (needs internet)
  const out = { kind:guessKind(text), french:text, meaning:"", example:"" };
  const base = text.trim().replace(/^(le |la |les |l'|l’|un |une |des |du |de la )/i,"").replace(/[!?.…]+$/,"");
  if (out.kind!=="phrase"){
    for (const t of [base, base.toLowerCase()]){
      try{
        const r = await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(t.replace(/ /g,"_")));
        if (!r.ok) continue;
        const j = await r.json(); const fr = j && j.fr;
        if (!fr || !fr.length) continue;
        const defs = fr.flatMap(x => x.definitions || []).filter(d => stripHTML(d.definition));
        if (!defs.length) continue;
        out.meaning = defs.slice(0,2).map(d => stripHTML(d.definition)).filter((v,i,a)=>a.indexOf(v)===i).join(" / ").slice(0,140);
        const exs = defs.flatMap(d => [...(d.parsedExamples||[]).map(e=>e.example), ...(d.examples||[])]).map(stripHTML).filter(e => e && e.length < 170);
        if (exs.length) out.example = exs[0];
        break;
      }catch{}
    }
  }
  if (!out.meaning){
    try{
      const r = await fetch("https://api.mymemory.translated.net/get?langpair=fr|en&q="+encodeURIComponent(text.trim()));
      const j = await r.json(); const t = j && j.responseData && j.responseData.translatedText;
      if (t && !/MYMEMORY WARNING|QUERY LENGTH/i.test(t)) out.meaning = stripHTML(t);
    }catch{}
  }
  if (out.example && base){
    const i = out.example.toLowerCase().indexOf(base.toLowerCase());
    if (i>=0) out.example = out.example.slice(0,i)+"["+out.example.slice(i,i+base.length)+"]"+out.example.slice(i+base.length);
  }
  return out;
}
const canAutoFill = () => !!S.ai || OFFLINE;
async function autoFill(text){
  if (S.ai) return lookupAI(text);
  if (OFFLINE){
    if (!getRelay()){ const e=new Error("norelay"); e.noRelay=true; throw e; }
    return lookupRelay(text);
  }
  throw new Error("unavailable");
}
function groqErr(e){
  if (e && e.noRelay) return "Pour remplir automatiquement, ajoute ton relais Groq dans Sauvegarde → Groq pour ✦ Remplir.";
  const g = (e && e.groq) || "";
  if (/groq_(429|498|500|502|503|504)/.test(g) || (e && (e.status===429 || e.status===503)))
    return "Groq est très occupé en ce moment. Attends une minute, puis touche ✦ Remplir.";
  if (/groq_401|missing_key/.test(g)) return "La clé Groq ne fonctionne plus. Vérifie GROQ_KEY dans Cloudflare.";
  if (e instanceof TypeError || (e && e.name==="TypeError")) return "Pas de connexion internet. Reconnecte-toi, puis touche ✦ Remplir.";
  return "Groq n'a pas pu répondre" + (e && e.status ? ` (erreur ${e.status})` : "") + ". Attends un moment et réessaie.";
}

      <div class="field"><label for="f-ex">Phrase d'exemple</label><textarea id="f-ex" placeholder="Depuis qu'il pleut, j'ai le cafard.">${esc(n.example)}</textarea>
        <span class="hint">Les mots entre [crochets] seront cachés dans le texte à trous.</span></div>
      <div class="btnrow"><button type="button" class="btn ghost" id="cancel">Annuler</button><button class="btn primary" type="submit">${isNew?"Ajouter au carnet":"Enregistrer"}</button></div>
    </form>`, s => {
      const setKind = k => { kind=k; s.querySelectorAll("[data-k]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.k===k)); };
      s.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => setKind(b.dataset.k)));

      const fr=$("#f-fr",s), mean=$("#f-mean",s), ex=$("#f-ex",s), msg=$("#fillMsg",s), btn=$("#fill",s);
      let busy=false, lastFilled="";
      async function fill(force){
        const text=fr.value.trim(); if(!text || busy || !canAutoFill()) return;
        if(!force && (mean.value.trim() || ex.value.trim())) return;
        busy=true; lastFilled=text; if(btn){ btn.disabled=true; btn.textContent="…"; }
        msg.innerHTML=`<span style="display:inline-flex;align-items:center;gap:8px"><span class="spinner" style="width:16px;height:16px;border-width:2px"></span>Je cherche le sens et un exemple…</span>`;
        try{
          const r = await autoFill(text);
          if (!document.body.contains(fr)) return;
          if (r.french && r.french!==text && fr.value.trim()===text) fr.value=r.french;
          if (force || !mean.value.trim()) mean.value = r.meaning || mean.value;
          if (force || !ex.value.trim()) ex.value = r.example || ex.value;
          setKind(r.kind);
          msg.textContent = (r.meaning||r.example) ? "Rempli pour toi. Tu peux tout modifier avant d'enregistrer." : "Groq n'a rien trouvé. Vérifie l'orthographe ou réessaie.";
        }catch(e){
          msg.innerHTML = `<div class="feedback close" style="margin-top:4px">${esc(S.ai ? aiErr(e) : groqErr(e))}</div>`;
        }finally{ busy=false; if(btn){ btn.disabled=false; btn.textContent="✦ Remplir"; } }
      }
      if (btn) btn.addEventListener("click", () => fill(true));
      fr.addEventListener("input", () => setKind(guessKind(fr.value)));
      fr.addEventListener("blur", () => { if (fr.value.trim() && fr.value.trim()!==lastFilled) fill(false); });
      fr.addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); fill(true); } });
      $("#ed",s).addEventListener("submit", e => {
        e.preventDefault();
        const french=fr.value.trim(); if(!french) return;
        const out = { ...n, kind, french, meaning:mean.value.trim(), example:ex.value.trim() };
        delete out.source;
        if (isNew){ out.id=uid(); out.created=Date.now(); out.box=0; out.due=0; }

        saveNote(out); closeSheet(); toast(isNew?"Ajouté au carnet":"Enregistré");
        const qi=$("#quickIn"); if(qi) qi.value="";
      });
      if (isNew && prefill && canAutoFill()) fill(false);
      else setTimeout(()=>{ if(isNew) fr.focus(); }, 250);
    });
}

function hl(sentence, target){

    const sk=$("#saveKey",s);

      try{ localStorage.setItem("carnet.apikey", v); }catch{}
      km.innerHTML=`<div class="loading"><div class="spinner"></div>Je vérifie la clé…</div>`;
      try{ await lookupAPI("bonjour"); km.innerHTML=`<div class="feedback ok">Clé enregistrée. ✦ Remplir utilise maintenant Claude Haiku 5.5.</div>`; $("#apiKey",s).value=""; }
      catch(e){ km.innerHTML = e.status===401||e.status===403 ? `<div class="feedback no">Clé refusée par Claude. Vérifie-la et réessaie.</div>` : `<div class="feedback close">Clé enregistrée, mais je n'ai pas pu la tester (pas d'internet ?). Elle sera utilisée dès que possible.</div>`; }
    });
    const dk=$("#delKey",s);
    if (dk) dk.addEventListener("click", () => { try{ localStorage.removeItem("carnet.apikey"); }catch{} openBackup(); toast("Clé supprimée"); });
    const exp=$("#exp",s);

      const d=new Date(), stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      const json = JSON.stringify({ app:"mon-carnet", version:1, exported:d.toISOString(), notes:S.notes, meta:S.meta }, null, 1);
      const name = "carnet-backup-"+stamp+".json";
      const done = () => { S.meta.lastBackup=Date.now(); saveMeta(); msg("ok", "Sauvegarde prête : "+name+". Garde-la dans Fichiers ou iCloud Drive."); render(); };
      try{
        const file = new File([json], name, { type:"application/json" });
        if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:"Sauvegarde Carnet" }); return done(); }
      }catch(e){ if (e && e.name==="AbortError") return; }
      try{
        const url = URL.createObjectURL(new Blob([json], { type:"application/json" }));
        const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 4000); done();
      }catch{ msg("no", "Impossible de créer le fichier. Réessaie."); }
    });
    $("#imp",s).addEventListener("click", () => $("#impFile",s).click());
    $("#impFile",s).addEventListener("change", async e => {
      const f=e.target.files && e.target.files[0]; if(!f) return;
      try{
        const data = JSON.parse(await f.text());
        const list = Array.isArray(data) ? data : data.notes;
        if (!Array.isArray(list)) throw 0;
        let added=0, updated=0;
        for (const raw of list){
          if(!raw || !raw.french) continue;
          const n={ ...raw, id: raw.id || uid() };
          const i=S.notes.findIndex(x=>x.id===n.id);
          if(i<0){ S.notes.push(n); added++; } else { S.notes[i]={ ...S.notes[i], ...n }; updated++; }
          await write(n.id, i<0 ? n : S.notes[i]);
        }
        S.notes.sort((a,b)=>(b.created||0)-(a.created||0));
        cache(); render();
        msg("ok", `${plural(added,"nouvelle note ajoutée","nouvelles notes ajoutées")}${updated?`, ${updated} mise${updated>1?"s":""} à jour`:""}.`);
      }catch{ msg("no", "Ce fichier n'est pas une sauvegarde du Carnet. Choisis un fichier nommé carnet-backup-….json."); }
      e.target.value="";
    });
  });
}

/* ---------- séances (cartes / trous / dictée / écrire / surprise) ---------- */
function pickNotes(max=10){
  const due=shuffle(S.notes.filter(isDue)).sort((a,b)=>(a.box||0)-(b.box||0));
  let picked=due.slice(0,max);
  const want=Math.min(max,S.notes.length);
  if (picked.length<want){
    const rest=shuffle(S.notes.filter(n=>!picked.includes(n))).sort((a,b)=>(a.due||0)-(b.due||0));
    picked=picked.concat(rest.slice(0, want-picked.length));
  }
  return shuffle(picked);
}
function startSession(mode){
  if (!S.notes.length) return;
  const items=pickNotes(mode==="write"?5:10).map(n=>({ id:n.id, mode: mode==="mix" ? mixMode() : mode }));
  UI.session={ kind:"cards", items, i:0, right:0 };
  window.scrollTo(0,0); render(); renderStep();
}
function mixMode(){ const m=["flash","flash","cloze","cloze"]; if(canSpeak()) m.push("listen","listen"); if(S.ai) m.push("write"); return m[Math.floor(Math.random()*m.length)]; }

}
function endSession(){ UI.session=null; stopVoice(); render(); window.scrollTo(0,0); }
function next(correct){

function clozeParts(n){
  const ex=n.example||"";
  const m=ex.match(/\[([^\]]+)\]/);
  if (m) return { before:clean(ex.slice(0,m.index)), answer:m[1], after:clean(ex.slice(m.index+m[0].length)) };
  const target=n.french.replace(/[!?.…]/g,"").trim();
  const i=ex.toLowerCase().replace(/[’]/g,"'").indexOf(target.toLowerCase().replace(/[’]/g,"'"));
  if (ex && target && i>=0) return { before:ex.slice(0,i), answer:ex.slice(i,i+target.length), after:ex.slice(i+target.length) };
  return null;
}
function checkAnswer(given, expected){ if (norm(given)===norm(expected)) return "ok"; if (loose(given)===loose(expected)) return "close"; return "no"; }

  app.querySelectorAll(".tile").forEach(b => b.addEventListener("click", () => {

      $("#mbar").style.width=Math.round(found/pool.length*100)+"%";

        setTimeout(()=>{ app.innerHTML=`<div class="done"><div class="score">${secs} s</div><div>${misses===0?"Sans faute !":plural(misses,"erreur","erreurs")}${isBest?" · nouveau record 🏆":best?` · record : ${best} s`:""}</div>
          <div class="btnrow" style="width:100%;max-width:380px"><button class="btn ghost" id="back">Retour</button><button class="btn primary" id="again">Rejouer</button></div></div>`;
          $("#back").addEventListener("click", endSession); $("#again").addEventListener("click", startMatch); }, 350); }
    } else { misses++; [sel,b].forEach(x=>{x.classList.add("shake"); setTimeout(()=>x.classList.remove("shake","sel"),360);}); sel=null; }
  }));
}

function wordsHTML(line, items){
  const low=line.toLowerCase().replace(/[’]/g,"'"); const ranges=[];
  items.forEach(t => { const tl=t.toLowerCase().replace(/[’]/g,"'"); if(!tl) return; const i=low.indexOf(tl); if(i>=0) ranges.push([i,i+tl.length]); });
  const out=[]; const re=/\S+/g; let m;
  while((m=re.exec(line))){ const a=m.index, b=a+m[0].length; const k=ranges.some(([x,y])=>a<y&&b>x); out.push(`<span class="w${k?" k":""}">${esc(m[0])}</span>`); }
  return out.join(" ");
}

  UI.session={ kind:"scene" }; render(); window.scrollTo(0,0);
  let alive=true, timers=[], token=0;
  const stopAll = () => { token++; timers.forEach(clearTimeout); timers=[]; stopVoice(); };
  const frame = inner => { app.innerHTML=`<div class="sess-top"><button class="x" id="quit" aria-label="Arrêter">✕</button><div style="flex:1;font-family:var(--f-display);font-weight:700;font-size:1.3rem">Mini-scène</div></div>${inner}`;
    $("#quit").addEventListener("click", () => { alive=false; stopAll(); endSession(); }); };
  frame(`<div class="loading"><div class="spinner"></div>Je prépare une scène avec : ${pool.map(n=>esc(n.french)).join(", ")}…</div>`);
  let r;
  try{
    r=await askJSON(`Write a very short, lively French dialogue (like a moment from a French TV series) for an adult learner at B2-C1 level.
It must naturally use ALL these items from her notebook, each at least once, in a form close to how they are written here: ${pool.map(n=>`"${n.french}"${n.meaning?` (${n.meaning})`:""}`).join("; ")}.
Only 4 to 6 lines in total. Each line at most 12 words. Two characters with French first names, everyday modern French, a tiny situation with a small twist or joke.
Then write one multiple-choice question per item, IN SIMPLE FRENCH, testing what it means IN THIS SCENE.
Return JSON only: {"title": short French title, "place": one of "cafe","metro","parc","bureau","boulangerie","appartement","rue", "a": {"name": first name, "look": "woman" or "man"}, "b": {"name": first name, "look": "woman" or "man"}, "lines":[{"who":"a" or "b","fr":"line"}], "questions":[{"item": the item, "q": question in simple French, "options": [4 short options in simple French], "answer": index 0-3 of the right option, "why": one short explanation in simple French}]}`);
  }catch(e){
    if(!alive) return;
    frame(`<div class="feedback no">${esc(aiErr(e))}</div><div style="margin-top:12px"><button class="btn block" id="back">Retour</button></div>`);
    $("#back").addEventListener("click", endSession); return;
  }
  if(!alive) return;
  const lines=(r.lines||[]).filter(l=>l&&l.fr).slice(0,6);
  const qs=(r.questions||[]).filter(q=>Array.isArray(q.options)&&q.options.length>=2);
  const items=pool.map(n=>n.french.replace(/[!?.…]/g,"").trim());
  const placeKey=PLACES[r.place]?r.place:"cafe"; const place=PLACES[placeKey];
  const sk=shuffle(SKINS), hr=shuffle(HAIRS);
  const A={ name:(r.a&&r.a.name)||"Léa", look:(r.a&&r.a.look)==="man"?"man":"woman" }, B={ name:(r.b&&r.b.name)||"Hugo", look:(r.b&&r.b.look)==="woman"?"woman":"man" };
  frame(`
    <div class="stage p-${placeKey}" id="stage" role="button" tabindex="0" aria-label="Scène. Touche pour la réplique suivante.">
      <div class="place-tag">${esc(place[0])}</div>
      <div class="props">${place.slice(1).map(e=>`<span>${e}</span>`).join("")}</div>
      <div class="actor a" id="actA">${avatarSVG(A.look, sk[0], hr[0], "var(--accent-2)")}<span class="nm">${esc(A.name)}</span></div>
      <div class="actor b" id="actB">${avatarSVG(B.look, sk[1], hr[1], "var(--wine)")}<span class="nm">${esc(B.name)}</span></div>
      <div id="bubWrap"><div class="bubble center">Touche ▶ pour commencer</div></div>
    </div>
    <div class="stage-ctrl">
      <button class="btn ghost" id="replay">⟲ Rejouer</button>
      <button class="btn ghost" id="pause">⏸ Pause</button>
      <button class="btn primary" id="skip">▶ Commencer</button>
    </div>
    <div class="q-big" style="font-size:1.35rem;margin-top:18px">${esc(r.title||"La scène")}</div>
    <div id="after"></div>`);
  let idx=-1, paused=false, finished=false;
  const actA=$("#actA"), actB=$("#actB");
  const setTalk = who => { actA.classList.toggle("talking", who==="a"); actB.classList.toggle("talking", who==="b"); actA.classList.toggle("dim", who==="b"); actB.classList.toggle("dim", who==="a"); };
  function showLine(i){
    stopAll(); const my=token;
    if(i>=lines.length) return finish();
    idx=i; const l=lines[i]; const who=l.who==="b"?"b":"a";
    $("#bubWrap").innerHTML=`<div class="bubble ${who}" aria-live="polite">${wordsHTML(l.fr, items)}</div>`;
    setTalk(who);
    const ws=[...$("#bubWrap").querySelectorAll(".w")];
    const per=Math.max(170, Math.min(320, 2600/Math.max(1,ws.length)));
    ws.forEach((w,k)=>timers.push(setTimeout(()=>{ if(my===token) w.classList.add("on"); }, k*per)));
    const doneTalking = () => { if(my!==token) return; ws.forEach(w=>w.classList.add("on")); setTalk(null); timers.push(setTimeout(()=>{ if(my===token && !paused) showLine(i+1); }, 1100)); };
    if(canSpeak()){
      let ended=false; const fin=()=>{ if(!ended){ ended=true; doneTalking(); } };
      say(l.fr, { rate:0.95, onEnd:fin, pitch: who==="a" ? (A.look==="woman"?1.2:0.95) : (B.look==="woman"?1.2:0.85) });
      timers.push(setTimeout(fin, ws.length*650+4000));
    } else timers.push(setTimeout(doneTalking, ws.length*per+900));
  }
  function finish(){
    stopAll(); setTalk(null); finished=true;
    actA.classList.remove("dim"); actB.classList.remove("dim");
    $("#bubWrap").innerHTML=`<div class="bubble center" style="font-family:var(--f-display);font-weight:700">Fin !</div>`;
    $("#pause").disabled=true; $("#skip").disabled=true;
    if($("#after").dataset.shown) return; $("#after").dataset.shown="1";
    $("#after").innerHTML=`
      <details class="transcript" style="margin-top:6px"><summary>Voir le texte</summary>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">${lines.map(l=>`<div class="line ${l.who==="b"?"b":""}"><span class="who">${esc(((l.who==="b"?B.name:A.name)||"?").slice(0,1))}</span><div class="say">${hl(l.fr, items.find(t=>l.fr.toLowerCase().includes(t.toLowerCase()))||"")}</div></div>`).join("")}</div></details>
      <div class="section-label">Questions</div>
      <div>${qs.map((q,qi)=>`<div class="card" style="min-height:0;margin-bottom:12px" data-q="${qi}"><div style="font-weight:700">${esc(q.q)}</div>
        ${q.options.map((o,oi)=>`<button class="opt" data-o="${oi}">${esc(o)}</button>`).join("")}<div class="why"></div></div>`).join("")}</div>
      <div id="sceneEnd"></div>`;
    let answered=0, right=0;
    $("#after").querySelectorAll("[data-q]").forEach(card => {
      const q=qs[+card.dataset.q];
      card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(card.dataset.done) return; card.dataset.done="1"; answered++;
        const ok=+b.dataset.o===+q.answer; if(ok) right++;
        b.classList.add(ok?"right":"wrong"); card.querySelectorAll(".opt")[+q.answer]?.classList.add("right");
        card.querySelector(".why").innerHTML=`<div style="font-size:.95rem;color:var(--muted);margin-top:8px">${esc(q.why||"")}</div>`;
        const note=pool.find(n=>loose(n.french).includes(loose(q.item||""))||loose(q.item||"").includes(loose(n.french)));
        if(note) grade(note, ok);
        if(answered===qs.length){ $("#sceneEnd").innerHTML=`<div class="done" style="padding-block:10px"><div class="score" style="font-size:2.6rem">${right}/${qs.length}</div>
          <div class="btnrow" style="width:100%;max-width:380px"><button class="btn ghost" id="back">Retour</button><button class="btn primary" id="again">Nouvelle scène</button></div></div>`;
          $("#back").addEventListener("click", endSession); $("#again").addEventListener("click", () => { stopAll(); startScene(); }); }
      }));
    });
  }
  const goNext = () => { if(finished) return; paused=false; $("#pause").textContent="⏸ Pause"; $("#skip").textContent="Suivant ›"; showLine(idx+1); };
  $("#stage").addEventListener("click", goNext);
  $("#stage").addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); goNext(); } });
  $("#skip").addEventListener("click", goNext);
  $("#replay").addEventListener("click", () => { finished=false; paused=false; $("#pause").disabled=false; $("#skip").disabled=false; $("#pause").textContent="⏸ Pause"; $("#skip").textContent="Suivant ›"; showLine(0); });
  $("#pause").addEventListener("click", () => {
    if(finished || idx<0) return;
    if(!paused){ paused=true; stopAll(); setTalk(null); $("#bubWrap").querySelectorAll(".w").forEach(w=>w.classList.add("on")); $("#pause").textContent="▶ Reprendre"; }
    else { paused=false; $("#pause").textContent="⏸ Pause"; showLine(idx); }
  });
}

render();
connect();
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(r => { try { r.update(); } catch {} }).catch(()=>{}); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(()=>{}); });
}
})();
</script>
</body>
</html>
